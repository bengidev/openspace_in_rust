[workspace]
members = [
    "openspace-core",
    "openspace-app",
    "openspace-platform",
    "openspace-theme",
    "openspace-storage",
    "openspace-secrets",
    "openspace-terminal",
    "openspace-chat",
    "openspace-ai",
    "openspace-editor",
    "openspace-lsp",
    "openspace-fs",
    "openspace-git",
    "openspace-welcome",
    "openspace-home",
]
resolver = "3"

[workspace.dependencies]
iced = { version = "0.14", features = ["canvas", "tokio"] }
tokio = { version = "1", features = ["full"] }
rusqlite = "0.39"
keyring = "4.0"
portable-pty = "0.9"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
anyhow = "1.0"
uuid = "1.0"
directories = "6.0"
tracing = "0.1"
